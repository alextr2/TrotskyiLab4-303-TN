<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Рядки, що біжать</title>
</head>

<body>

<marquee behavior="alternate" bgcolor="#6A1B9A">
    Текст у рядку коливається з боку в бік.
</marquee>

<marquee behavior="scroll" direction="left" bgcolor="#00838F">
    Текст пробігає справа наліво та з'являється знову.
</marquee>

<marquee behavior="slide" direction="right" bgcolor="#2E7D32">
    Текст у рядку пробігає зліва направо та зупиняється.
</marquee>

<marquee behavior="scroll" direction="right"
         scrollamount="5" scrolldelay="100"
         bgcolor="#EF6C00">
    Текст рухається з першим режимом запізнення.
</marquee>

<marquee behavior="scroll" direction="left"
         scrollamount="15" scrolldelay="200"
         bgcolor="#C62828">
    Текст рухається з другим режимом запізнення.
</marquee>

</body>
</html>
